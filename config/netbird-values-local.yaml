  # Mount internal CA so management can verify Keycloak's self-signed TLS cert
  volumes:
    - name: internal-ca
      secret:
        secretName: local-root-ca-secret
        items:
          - key: tls.crt
            path: ca.crt

  volumeMounts:
    - name: internal-ca
      mountPath: /etc/ssl/internal-ca
      readOnly: true

  env:
    SSL_CERT_FILE: /etc/ssl/internal-ca/ca.crt

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ingress:
