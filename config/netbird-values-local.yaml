# NetBird Helm values – lokal PoC (k3d + Colima)
# Chart: netbird/netbird
#
# VIGTIGT: IP nedenfor er din nuværende lokale IP (192.168.50.57)
# Hvis IP'en skifter: søg/erstat 192.168.50.57 med ny IP i denne fil

management:
  enabled: true

  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=true
      - --single-account-mode-domain=netbird.192.168.50.57.nip.io
      - --dns-domain=nb.internal

  # WARNING: The secrets below are TEST VALUES for local PoC only.
  # DO NOT use these values in production — they are committed to version control
  # and must be treated as compromised. Regenerate with:
  #   DataStoreEncryptionKey: openssl rand -base64 32
  #   Relay.Secret / NB_AUTH_SECRET: openssl rand -base64 24
  # For production, store secrets in Kubernetes Secrets — see docs/netbird-secrets.md
