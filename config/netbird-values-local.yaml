# NetBird Helm values – lokal PoC (k3d + Colima)
# Chart: netbird/netbird
#
# VIGTIGT: IP nedenfor er din nuværende lokale IP (192.168.50.57)
# Hvis IP'en skifter: søg/erstat 192.168.50.57 med ny IP i denne fil

management:
  enabled: true

  podCommand:
    args:
      - --port=80
      - --log-file=console
      - --log-level=info
      - --disable-anonymous-metrics=true
      - --single-account-mode-domain=netbird.192.168.50.57.nip.io
      - --dns-domain=netbird.192.168.50.57.nip.io

  configmap: |-
    {
      "Stuns": [
        {
          "Proto": "udp",
          "URI": "stun:192.168.50.57:3478",
          "Username": "",
          "Password": ""
        }
      ],
      "TURNConfig": {
        "TimeBasedCredentials": false,
        "CredentialsTTL": "12h0m0s",
        "Secret": "secret",
        "Turns": [
          {
            "Proto": "udp",
            "URI": "turn:192.168.50.57:3478",
            "Username": "netbird",
            "Password": "CHANGE_ME_STRONG_PASSWORD"
          }
        ]
      },
      "Signal": {
        "Proto": "https",
        "URI": "signal.netbird.192.168.50.57.nip.io:443",
        "Username": "",
        "Password": ""
      },
      "Datadir": "/var/lib/netbird/",
      "DataStoreEncryptionKey": "o188kFnz7nybaesCk3XNoNJwQpsPJqAyuOYMm7psO9w=",
      "HttpConfig": {
        "LetsEncryptDomain": "",
        "CertFile": "",
        "CertKey": "",
        "AuthAudience": "netbird",
        "AuthIssuer": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird",
        "AuthUserIDClaim": "",
        "AuthKeysLocation": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/protocol/openid-connect/certs",
        "OIDCConfigEndpoint": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/.well-known/openid-configuration",
        "IdpSignKeyRefreshEnabled": false
      },
      "IdpManagerConfig": {
        "ManagerType": "none"
      },
      "DeviceAuthorizationFlow": {
        "Provider": "hosted",
        "ProviderConfig": {
          "ClientID": "netbird",
          "ClientSecret": "",
          "Domain": "keycloak.netbird.192.168.50.57.nip.io",
          "Audience": "netbird",
          "TokenEndpoint": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/protocol/openid-connect/token",
          "DeviceAuthEndpoint": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/protocol/openid-connect/auth/device",
          "AuthorizationEndpoint": "",
          "Scope": "openid",
          "UseIDToken": false,
          "RedirectURLs": null
        }
      },
      "PKCEAuthorizationFlow": {
        "ProviderConfig": {
          "ClientID": "netbird",
          "ClientSecret": "",
          "Domain": "",
          "Audience": "netbird",
          "TokenEndpoint": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/protocol/openid-connect/token",
          "DeviceAuthEndpoint": "",
          "AuthorizationEndpoint": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/protocol/openid-connect/auth",
          "Scope": "openid profile email",
          "UseIDToken": false,
          "RedirectURLs": ["http://localhost:53000"]
        }
      },
      "StoreConfig": {
        "Engine": "sqlite"
      },
      "ReverseProxy": {
        "TrustedHTTPProxies": null,
        "TrustedHTTPProxiesCount": 0,
        "TrustedPeers": null
      }
    }

  # Mount internal CA so management can verify Keycloak's self-signed TLS cert
  volumes:
    - name: internal-ca
      secret:
        secretName: netbird-root-ca-secret
        items:
          - key: tls.crt
            path: ca.crt

  volumeMounts:
    - name: internal-ca
      mountPath: /etc/ssl/internal-ca
      readOnly: true

  env:
    SSL_CERT_FILE: /etc/ssl/internal-ca/ca.crt

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: netbird-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: api.netbird.192.168.50.57.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-management-tls
        hosts:
          - api.netbird.192.168.50.57.nip.io

signal:
  enabled: true
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: netbird-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: signal.netbird.192.168.50.57.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-signal-tls
        hosts:
          - signal.netbird.192.168.50.57.nip.io

dashboard:
  enabled: true
  env:
    NETBIRD_MGMT_API_ENDPOINT: "https://api.netbird.192.168.50.57.nip.io"
    NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://api.netbird.192.168.50.57.nip.io"
    AUTH_CLIENT_ID: "netbird"
    AUTH_AUTHORITY: "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird"
    AUTH_AUDIENCE: "netbird"
    USE_AUTH0: "false"
    AUTH_SUPPORTED_SCOPES: "openid profile email"
    NETBIRD_TOKEN_SOURCE: "accessToken"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: netbird-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: app.netbird.192.168.50.57.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-dashboard-tls
        hosts:
          - app.netbird.192.168.50.57.nip.io

# Relay disabled for local PoC — coturn handles TURN relay
relay:
  enabled: false

coturn:
  enabled: true
  service:
    type: LoadBalancer
  username: netbird
  password: CHANGE_ME_STRONG_PASSWORD
  externalIP: ""
  minPort: 49152
  maxPort: 65535
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
