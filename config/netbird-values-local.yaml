        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-management-tls
        hosts:
          - api.netbird.192.168.50.57.nip.io

signal:
  enabled: true
  port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: local-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: signal.netbird.192.168.50.57.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-signal-tls
        hosts:
          - signal.netbird.192.168.50.57.nip.io

dashboard:
  enabled: true
  env:
    NETBIRD_MGMT_API_ENDPOINT: "https://api.netbird.192.168.50.57.nip.io"
    NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://api.netbird.192.168.50.57.nip.io"
    AUTH_CLIENT_ID: "netbird"
    AUTH_AUTHORITY: "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird"
    AUTH_AUDIENCE: "netbird"
    USE_AUTH0: "false"
    AUTH_SUPPORTED_SCOPES: "openid profile email"
    NETBIRD_TOKEN_SOURCE: "accessToken"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: local-ca-issuer
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
    hosts:
      - host: app.netbird.192.168.50.57.nip.io
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: netbird-dashboard-tls
        hosts:
          - app.netbird.192.168.50.57.nip.io

# gRPC IngressRoutes — standard Kubernetes Ingress does not support gRPC (HTTP/2).
# Traefik requires scheme: h2c to forward gRPC traffic to the backend.
# These routes handle the gRPC paths for management and signal alongside
# the existing standard Ingress which handles REST and TLS cert issuance.
extraManifests:
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: netbird-management-grpc
      namespace: netbird
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`api.netbird.192.168.50.57.nip.io`) && PathPrefix(`/management`)
          services:
            - name: netbird-management
              port: 80
              scheme: h2c
        - kind: Rule
          match: Host(`api.netbird.192.168.50.57.nip.io`) && PathPrefix(`/api`)
          services:
            - name: netbird-management
              port: 80
        - kind: Rule
          match: Host(`api.netbird.192.168.50.57.nip.io`) && PathPrefix(`/relay`)
          services:
            - name: netbird-relay
              port: 33080
      tls:
        secretName: netbird-management-tls
  - apiVersion: traefik.io/v1alpha1
    kind: IngressRoute
    metadata:
      name: netbird-signal-grpc
      namespace: netbird
    spec:
      entryPoints:
        - websecure
      routes:
        - kind: Rule
          match: Host(`signal.netbird.192.168.50.57.nip.io`) && PathPrefix(`/signalexchange`)
          services:
            - name: netbird-signal
              port: 80
              scheme: h2c
      tls:
        secretName: netbird-signal-tls

relay:
  enabled: true
  env:
    NB_LOG_LEVEL: info
    NB_LISTEN_ADDRESS: ":33080"
    NB_EXPOSED_ADDRESS: "rels://api.netbird.192.168.50.57.nip.io:443/relay"
    # WARNING: TEST VALUE — DO NOT use in production (committed to version control).
    # Must match Relay.Secret in management configmap above.
    # Regenerate: openssl rand -base64 24 — see docs/netbird-secrets.md
    NB_AUTH_SECRET: "hwKu8wsOfV64EYzgLE6CGBZUiB8w/CTN"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
