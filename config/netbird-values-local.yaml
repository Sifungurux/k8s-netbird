    {
      "Stuns": [
        {
          "Proto": "udp",
          "URI": "stun:192.168.50.57:3478",
          "Username": "",
          "Password": ""
        }
      ],
      "TURNConfig": {
        "TimeBasedCredentials": false,
        "CredentialsTTL": "12h0m0s",
        "Secret": "secret",
        "Turns": [
          {
            "Proto": "udp",
            "URI": "turn:192.168.50.57:3478",
            "Username": "netbird",
            "Password": "VtVZusRvlquGBHh++NRyHzzz"
          }
        ]
      },
      "Signal": {
        "Proto": "https",
        "URI": "signal.netbird.192.168.50.57.nip.io:443",
        "Username": "",
        "Password": ""
      },
      "Datadir": "/var/lib/netbird/",
      "DataStoreEncryptionKey": "lCQPrDK0Vyr1jCcb6qVJHdFjXBlXJCzAIy485a6/o/U=",
      "HttpConfig": {
        "LetsEncryptDomain": "",
        "CertFile": "",
        "CertKey": "",
        "AuthAudience": "netbird",
        "AuthIssuer": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird",
        "AuthUserIDClaim": "",
        "AuthKeysLocation": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/protocol/openid-connect/certs",
        "OIDCConfigEndpoint": "https://keycloak.netbird.192.168.50.57.nip.io/realms/netbird/.well-known/openid-configuration",
        "IdpSignKeyRefreshEnabled": true
      },
      "IdpManagerConfig": {
