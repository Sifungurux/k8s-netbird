# Keycloak Helm values – NetBird PoC (managed cluster)
# Chart: codecentric/keycloakx (uses official quay.io/keycloak/keycloak)
# Namespace: keycloak
# Ingress: Traefik + Let's Encrypt
#
# Prerequisites:
#   helm repo add codecentric https://codecentric.github.io/helm-charts
#   helm repo update

# Production mode: start (not start-dev) — requires external DB and TLS
command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: CHANGE_ME_STRONG_ADMIN_PASSWORD
  - name: KC_HOSTNAME
    value: keycloak.netbird.kirk-pedersen.dk
  - name: KC_PROXY_HEADERS
    value: xforwarded
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL
    value: jdbc:postgresql://keycloak-postgresql:5432/keycloak
  - name: KC_DB_USERNAME
    value: keycloak
  - name: KC_DB_PASSWORD
    value: CHANGE_ME_DB_PASSWORD

http:
  relativePath: "/"

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  rules:
    - host: keycloak.netbird.kirk-pedersen.dk
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - keycloak.netbird.kirk-pedersen.dk
      secretName: keycloak-tls

# Bundled PostgreSQL subchart (Bitnami)
# Service is exposed as keycloak-postgresql:5432 — matches KC_DB_URL above
postgresql:
  enabled: true
  auth:
    username: keycloak
    password: CHANGE_ME_DB_PASSWORD   # keep in sync with KC_DB_PASSWORD above
    database: keycloak
  primary:
    persistence:
      enabled: true
      size: 2Gi
