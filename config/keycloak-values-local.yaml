# Keycloak Helm values – lokal PoC (k3d + Colima)
# Chart: codecentric/keycloakx (uses official quay.io/keycloak/keycloak)
#
# PoC mode: start-dev with embedded H2 — no external DB needed.
# Switch to start + PostgreSQL when moving to managed cluster.

# start-dev: embedded H2, relaxed TLS checks — PoC only
command:
  - "/opt/keycloak/bin/kc.sh"
  - "start-dev"

extraEnv: |
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    value: CHANGE_ME_STRONG_ADMIN_PASSWORD
  - name: KC_HOSTNAME
    value: keycloak.netbird.192.168.50.57.nip.io

proxy:
  mode: xforwarded
  http:
    enabled: true

http:
  relativePath: "/"

extraVolumes: |
  - name: keycloak-data
    persistentVolumeClaim:
      claimName: keycloak-data

extraVolumeMounts: |
  - name: keycloak-data
    mountPath: /opt/keycloak/data

resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: true
  ingressClassName: traefik
  annotations:
    cert-manager.io/cluster-issuer: netbird-ca-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
  rules:
    - host: keycloak.netbird.192.168.50.57.nip.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - keycloak.netbird.192.168.50.57.nip.io
      secretName: keycloak-tls
