# k3d cluster config – NetBird PoC (local)
# 1 control-plane + 2 workers
# Traefik and ServiceLB kept enabled — NetBird needs both
#
# Brug: k3d cluster create --config k3d-netbird.yaml

apiVersion: k3d.io/v1alpha5
kind: Simple

metadata:
  name: netbird-poc

servers: 1
agents: 2

image: rancher/k3s:v1.31.4-k3s1

ports:
  - port: 80:80
    nodeFilters: ["loadbalancer"]
  - port: 443:443
    nodeFilters: ["loadbalancer"]
  - port: 3478:3478/udp
    nodeFilters: ["loadbalancer"]
  - port: 5353:53/udp
    nodeFilters: ["loadbalancer"]
  - port: 5353:53/tcp
    nodeFilters: ["loadbalancer"]

# Traefik og ServiceLB er bevidst IKKE deaktiveret her
# (modsat Sigstore-opsætningen som bruger ingress-nginx)
# NetBird values bruger ingressClassName: traefik
