# PRs: lint + render the chart, and refuse chart changes without a version
# bump. main: publish chart/netbird to oci://ghcr.io/sifungurux/charts if
# that version is not there yet, and sign it keyless with cosign. Run it by
# hand (workflow_dispatch) to sign a version that is already published.
# (yq is preinstalled on ubuntu runners.)
name: chart
on:
  pull_request:
    paths:
      - chart/**
      - test/values.yaml
      - scripts/chart-version-check*.sh
      - .github/workflows/chart.yaml
  push:
    branches: [main]
    paths:
      - chart/**
  workflow_dispatch:

permissions:
  contents: read

# An explicit `shell: bash` adds pipefail (the default is `bash -e`): without
# it a failed `curl | jq` token request reads as an empty token, GHCR says 404
# and the guard would push over an existing version.
defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint chart/netbird -f test/values.yaml
      - run: helm template netbird chart/netbird -n netbird -f test/values.yaml > /dev/null
      - run: scripts/chart-version-check.test.sh
      - run: scripts/chart-version-check.sh "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: chart-publish
    permissions:
      contents: read
      packages: write
      id-token: write  # cosign keyless: GitHub OIDC token for Fulcio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      # Again on main: two PRs green against the same base can both bump to
      # the same version. The second merge then changes the chart without a
      # new version, and the existence check below would skip it silently.
      - name: Chart changes since the previous main bumped the version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: scripts/chart-version-check.sh "${BEFORE}"
      - name: Push the chart unless this version exists
        id: push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(yq .version chart/netbird/Chart.yaml)
          # Push only on a definite 404: a timeout or 5xx must not re-tag a
          # published version (homelab pins its digest). GHCR also says 404 for
          # a bad token; the login and push then fail instead.
          token=$(curl -sSf -u "${{ github.actor }}:${GITHUB_TOKEN}" \
            "https://ghcr.io/token?scope=repository:sifungurux/charts/netbird:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w '%{http_code}' -I \
            -H "Authorization: Bearer ${token}" \
            -H "Accept: application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/sifungurux/charts/netbird/manifests/${v}" || true)
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${GITHUB_TOKEN}"
          # Sign only bytes this run built or checked: the digest comes from
          # helm push/pull's own output, never from a second tag lookup.
          case ${code} in
            200)
              echo "netbird ${v} already published, checking it is chart/netbird"
              out=$(helm pull oci://ghcr.io/sifungurux/charts/netbird --version "${v}" \
                --untar --untardir published 2>&1) || { echo "${out}" >&2; exit 1; }
              # helm package rewrites Chart.yaml (drops comments), so compare it as data.
              if ! { diff -r -x Chart.yaml published/netbird chart/netbird &&
                     diff <(yq -o=json 'sort_keys(..)' published/netbird/Chart.yaml) \
                          <(yq -o=json 'sort_keys(..)' chart/netbird/Chart.yaml); }; then
                echo "published netbird ${v} is not chart/netbird, not signing" >&2; exit 1
              fi ;;
            404)
              helm package chart/netbird
              out=$(helm push "netbird-${v}.tgz" oci://ghcr.io/sifungurux/charts 2>&1) \
                || { echo "${out}" >&2; exit 1; } ;;
            *) echo "GHCR answered ${code} for netbird ${v}, not pushing" >&2; exit 1 ;;
          esac
          echo "${out}"
          digest=$(awk '/^Digest:/ { print $2 }' <<< "${out}")
          [[ ${digest} == sha256:* ]] || { echo "no digest for netbird ${v}" >&2; exit 1; }
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # Keyless: Fulcio certifies this workflow on main as the signer, and
      # homelab's OCIRepository verifies exactly that identity. Signing an
      # already signed digest again only adds a signature. The signature lands
      # in the public Rekor log (repo name, workflow, commit SHA; not the code).
      - name: Sign the chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="ghcr.io/sifungurux/charts/netbird@${DIGEST}"
          cosign login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${GITHUB_TOKEN}"
          cosign sign --yes "${ref}"
          cosign verify "${ref}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity https://github.com/Sifungurux/k8s-netbird/.github/workflows/chart.yaml@refs/heads/main \
            > /dev/null
