# PRs: lint + render the chart, and refuse chart changes without a version
# bump. main: publish chart/netbird to oci://ghcr.io/sifungurux/charts if
# that version is not there yet. (yq is preinstalled on ubuntu runners.)
name: chart
on:
  pull_request:
    paths:
      - chart/**
      - test/values.yaml
      - scripts/chart-version-check*.sh
      - .github/workflows/chart.yaml
  push:
    branches: [main]
    paths:
      - chart/**

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: helm lint chart/netbird -f test/values.yaml
      - run: helm template netbird chart/netbird -n netbird -f test/values.yaml > /dev/null
      - run: scripts/chart-version-check.test.sh
      - run: scripts/chart-version-check.sh "origin/${{ github.base_ref }}"

  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Push the chart unless this version exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "${GITHUB_TOKEN}"
          v=$(yq .version chart/netbird/Chart.yaml)
          # ponytail: any failure of `helm show` (not only "not found") means
          # push; GHCR then re-tags the same chart version from the same commit.
          if helm show chart oci://ghcr.io/sifungurux/charts/netbird --version "${v}" >/dev/null 2>&1; then
            echo "netbird ${v} already published"
            exit 0
          fi
          helm package chart/netbird
          helm push "netbird-${v}.tgz" oci://ghcr.io/sifungurux/charts
