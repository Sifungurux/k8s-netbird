# Env copied from the upstream quickstart's render_dashboard_env, wired
# to the embedded IdP. TLS terminates at the Gateway, so the dashboard's
# own nginx serves plain HTTP (LETSENCRYPT_DOMAIN=none).
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbird-dashboard
  namespace: netbird
data:
  NETBIRD_MGMT_API_ENDPOINT: https://${NETBIRD_DOMAIN}
  NETBIRD_MGMT_GRPC_API_ENDPOINT: https://${NETBIRD_DOMAIN}
  AUTH_AUDIENCE: netbird-dashboard
  AUTH_CLIENT_ID: netbird-dashboard
  AUTH_CLIENT_SECRET: ""
  AUTH_AUTHORITY: https://${NETBIRD_DOMAIN}/oauth2
  USE_AUTH0: "false"
  AUTH_SUPPORTED_SCOPES: openid profile email groups
  AUTH_REDIRECT_URI: /nb-auth
  AUTH_SILENT_REDIRECT_URI: /nb-silent-auth
  NGINX_SSL_PORT: "443"
  LETSENCRYPT_DOMAIN: none
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netbird-dashboard
  template:
    metadata:
      labels:
        app: netbird-dashboard
    spec:
      containers:
        - name: dashboard
          image: netbirdio/dashboard:v2.94.0
          envFrom:
            - configMapRef:
                name: netbird-dashboard
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: netbird-dashboard
  namespace: netbird
spec:
  selector:
    app: netbird-dashboard
  ports:
    - name: http
      port: 80
      targetPort: http
