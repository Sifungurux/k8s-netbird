# The NetBird server is not a peer. This pod is: it joins the mesh with a
# setup key, and a NetBird Network (configured in the dashboard) routes
# the cluster's LAN through it, masqueraded. Pod egress to the LAN is
# SNATed to the node by the CNI, so no hostNetwork is needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netbird-routing-peer
  namespace: netbird
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netbird-routing-peer
  template:
    metadata:
      labels:
        app: netbird-routing-peer
    spec:
      containers:
        - name: netbird
          image: netbirdio/netbird:0.80.0
          env:
            - name: NB_MANAGEMENT_URL
              value: https://${NETBIRD_DOMAIN}
            - name: NB_HOSTNAME
              value: routing-peer-${CLUSTER_NAME}
            - name: NB_SETUP_KEY
              valueFrom:
                secretKeyRef:
                  name: netbird-routing-peer
                  key: setup-key
          # Not privileged. Kernel WireGuard needs only NET_ADMIN (no
          # /dev/net/tun), and the pod netns inherits ip_forward=1 from the
          # node. NET_RAW is for iptables (masquerade). Expected log noise
          # from the read-only /proc/sys and the memlock limit:
          #   - the src_valid_mark sysctl write fails: it only matters if this
          #     peer itself uses NetBird routes;
          #   - the eBPF wg proxy falls back to the user-space UDP proxy.
          # Verified on the rack 2026-10-20: phone on 4G reached the LAN.
          securityContext:
            privileged: false
            capabilities:
              add: [NET_ADMIN, NET_RAW]
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: state
              mountPath: /var/lib/netbird
      volumes:
        - name: state
          emptyDir: {}
