---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: netbird-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: NetBird Local CA
  secretName: netbird-root-ca-secret
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 384
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: netbird-ca-issuer
spec:
  ca:
    secretName: netbird-root-ca-secret
